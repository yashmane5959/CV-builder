<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CV Builder</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="CVform.css" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body class="form-body">
    <h1 class="cv_title pt-5 home-header">
      <i class="bi bi-person-vcard"></i>CV Builder
    </h1>

    <p class="cv_title home-header">
      Fill in your details and generate your professional CV
    </p>
    <div class="form-container mt-4 p-3" id="form-container">
      <form action="submit_cv.php" method="post">
        <!-- Full Name -->
        <label for="personaml details"
          ><h3>
            <i class="bi bi-person-circle m-2"></i>Personal Details
          </h3></label
        ><br /><br />
        <label for="name">Name:</label>

        <input
          type="text"
          id="name"
          name="name"
          required
          placeholder="Enter your name"
        />

        <br /><br />

        <!-- Email -->
        <label for="email">Email:</label>

        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="Enter your email"
        />

        <br /><br />

        <!-- Phone -->
        <label for="phone">Phone:</label>

        <input
          type="tel"
          id="phone"
          name="phone"
          maxlength="10"
          pattern="[0-9]{10}"
          placeholder="Enter your 10-digit phone number"
        />

        <br /><br />

        <!-- Date of Birth -->
        <label for="dob">Date of Birth:</label>

        <input type="date" id="dob" name="dob" />

        <br /><br />

        <!-- Gender -->
        <label>Gender:</label>

        <br />

        <input type="radio" id="male" name="gender" value="Male" /> Male

        <br />

        <input type="radio" id="female" name="gender" value="Female" />
        Female

        <br />

        <input type="radio" id="other" name="gender" value="Other" />
        Other

        <br /><br />

        <!-- Mother Tongue -->
        <label for="language">Mother Tongue:</label>

        <select id="language" name="language">
          <option value="">Select language</option>

          <option value="Hindi">Hindi</option>

          <option value="Marathi">Marathi</option>

          <option value="Gujarati">Gujarati</option>

          <option value="Tamil">Tamil</option>

          <option value="Other">Other</option>
        </select>

        <br /><br />

        <!-- English Level -->
        <label>Level of Speaking English:</label>

        <br />

        <input
          type="radio"
          id="beginner"
          name="english_level"
          value="Beginner"
        />
        Beginner

        <br />

        <input
          type="radio"
          id="moderate"
          name="english_level"
          value="Moderate"
        />
        Moderate

        <br />

        <input
          type="radio"
          id="advanced"
          name="english_level"
          value="Advanced"
        />
        Advanced

        <br /><br />

        <!-- Education -->
        <hr />
        <h3><i class="bi bi-card-text m-2"></i> Educational Details</h3>
        <label for="education">Education:</label>

        <br />

        <textarea
          id="education"
          name="education"
          rows="4"
          cols="50"
          placeholder="Enter your education details (e.g. degree, college, year)"
        ></textarea>

        <br /><br />

        <!-- Technical Skills -->
        <label for="technical_skills"> Technical Skills: </label>

        <br />

        <textarea
          id="technical_skills"
          name="technical_skills"
          rows="4"
          cols="50"
          placeholder="Enter your technical skills (e.g. HTML, CSS, JavaScript)"
        ></textarea>

        <br /><br />

        <!-- Other Skills -->
        <label for="other_skills"> Other Skills: </label>

        <br />

        <textarea
          id="other_skills"
          name="other_skills"
          rows="4"
          cols="50"
          placeholder="Enter your other skills (e.g. communication, leadership)"
        ></textarea>

        <br /><br />

        <!-- Experience -->
        <label for="experience"> Experience: </label>

        <br />

        <textarea
          id="experience"
          name="experience"
          rows="4"
          cols="50"
          placeholder="Enter your experience details (e.g. job title, company, duration)"
        ></textarea>

        <br /><br />

        <!-- Projects -->
        <label for="projects"> Projects: </label>

        <br />

        <textarea
          id="projects"
          name="projects"
          rows="4"
          cols="50"
          placeholder="Enter your project details"
        ></textarea>

        <br /><br />

        <!-- LinkedIn -->
        <label for="linkedin"> LinkedIn: </label>

        <input
          type="url"
          id="linkedin"
          name="linkedin"
          placeholder="https://linkedin.com/in/yourname"
        />

        <br /><br />

        <!-- GitHub -->
        <label for="github"> GitHub: </label>

        <input
          type="url"
          id="github"
          name="github"
          placeholder="https://github.com/yourname"
        />

        <br /><br />

        <!-- Portfolio -->
        <label for="portfolio"> Portfolio: </label>

        <input
          type="url"
          id="portfolio"
          name="portfolio"
          placeholder="https://yourportfolio.com"
        />

        <br /><br />

        <!-- Photo -->
        <label for="photo"> Upload Photo: </label>

        <input type="file" id="photo" name="photo" accept="image/*" />

        <br /><br />

        <!-- Buttons -->

        <input
          type="submit"
          value="Choose Style"
          class="button btn btn-success"
        />

        <input type="reset" value="Reset" class="btn btn-danger" />
      </form>

      <!-- Back to Home -->
    </div>
    <button
      class="btn button btn-primary"
      id="cv_button"
      onclick="window.location.href = 'index.html'"
    >
      <i class="bi bi-house"></i>
      Back to Home
    </button>
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
